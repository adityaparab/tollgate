[project]
name = "tollgate"
version = "0.1.0"
description = "Self-hostable, MCP-native control plane for AI agents: gateway, policy and approvals, identity, cost attribution and audit log."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Aditya Parab", email = "mradityaparab@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.2",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
tollgate = "tollgate:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "inline-snapshot>=0.36.1",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src"]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]