# Hooks run the ruff pinned in uv.lock, so local checks and CI never drift apart.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: unsupported
        types_or: [python, pyi]
        require_serial: true
